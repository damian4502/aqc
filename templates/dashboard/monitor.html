{% extends 'base.html' %}
{% load static %}

{% block title %}Diferencialni tlak - Air Quality Control{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold text-white">Live monitor</h1>
        <a href="/dashboard/" class="text-blue-400 hover:text-blue-300 flex items-center gap-2">
            ← Nazaj na pregled
        </a>
    </div>

    <!-- Izbira referenčnega senzorja -->
    <div class="glass rounded-3xl p-6 mb-8">
        <label class="block text-sm text-slate-400 mb-2 font-medium">Parameter</label>
        <select id="ref-sensor" class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl px-5 py-3 text-lg">
            <option value="">-- Izberi parameter --</option>
            {% for s in parameters %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
        </select>

        <label class="block text-sm text-slate-400 mb-2 font-medium">Prostor</label>
        <select id="add-room" class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl px-5 py-3 text-lg">
            <option value="">-- Izberi prostor --</option>
            {% for s in rooms %}
            <option value="delta-row-{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
        </select>

        <div class="flex gap-3 mt-6">
            <button onclick="addAllRooms()" 
                    class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-3 rounded-2xl transition-all active:scale-95">
                ➕ Dodaj vse prostore
            </button>
            <button onclick="removeAllRooms()" 
                    class="flex-1 bg-red-600 hover:bg-red-500 text-white font-medium px-6 py-3 rounded-2xl transition-all active:scale-95">
                🗑️ Odstrani vse
            </button>
            <button onclick="clearChart()" 
                    class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium px-6 py-3 rounded-2xl transition-all active:scale-95">
                🧹 Počisti graf
            </button>
        </div>

		</div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Tabela ΔP -->
        <div class="lg:col-span-5 glass rounded-3xl p-6">
            <h2 class="text-lg font-semibold mb-4">Trenutne vrednosti</h2>
            <table class="w-full">
                <thead>
                    <tr class="border-b border-slate-700">
                        <th class="text-left py-3 px-4">Prostor / Senzor</th>
                        <th class="text-right py-3 px-4">Vrednost</th>
                        <th class="text-right py-3 px-4 text-xs">Zadnja meritev</th>
                    </tr>
                </thead>
                <tbody id="delta-table" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>

<!-- Graf in kontrola -->
<div class="lg:col-span-7 glass rounded-3xl p-6">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold" id="chart-name">Graf vrednosti</h2>
        <div class="flex gap-2">
        </div>
    </div>
    
    <!-- Pomembno: fiksna višina + omejitev Y-osi -->
    <div style="height: 460px;">
        <canvas id="deltaChart"></canvas>
    </div>
</div>
    </div>
</div>


<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
let pageVisible = true;
// Spremljanje vidnosti zavihka
document.addEventListener('visibilitychange', () => {
    pageVisible = document.visibilityState === 'visible';
    
    if (pageVisible) {
        console.log('%c✅ Zavihek viden – nadaljujem z live updat-i', 'color: #10b981; font-weight: bold');
        // Tukaj lahko po želji tudi reconnectaš WebSocket
		//connectMQTT();
		publishLiveDataMode();
    } else {
        console.log('%c⏸️ Zavihek v ozadju – zaustavljam updat-e', 'color: #f59e0b');
		//client.end();
    }
});


    let client;
	
	let parameter_map = {};
	
	{% for p in parameters %}
	parameter_map["{{p.identifier}}"] = {{p.id}};
	{% endfor %}

    function connectMQTT() {
      client = mqtt.connect('ws://192.168.1.95:9001', {
        reconnectPeriod: 3000,
        connectTimeout: 10000
      });

      client.on('connect', function () {
        client.subscribe('vila/sentjane/#', function (err) {
          if (!err) console.log('Naročen na vse senzorje: vila/sentjane/#');
        });
      });

      client.on('message', function (topic, message) {
        const time = new Date().toLocaleTimeString('sl-SI', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        const payload = message.toString();
		try { jdata = JSON.parse(payload); } catch (e) { console.warn("Received non-JSON message on ${topic}: ${payload}"); return;}
		
		
		for (item in jdata) {
			if (!mqtt_topics[topic]) continue;
			let data = {}
			data['parameter_id'] = parameter_map[item]
			if (data['parameter_id'] == selectedParameter) {
				data["room_id"] = mqtt_topics[topic].room_id
				data["sensor_id"] = mqtt_topics[topic].sensor_id
				data["value"] = jdata[item]
				//console.log(data);
				updateLiveData(data);
			}
		}
				
		
		

		//console.log(payload);
		
		
      });

	

    }

	setInterval(publishLiveDataMode, 9000);
	
	function publishLiveDataMode() {
		if (pageVisible)
		
		for (p in parameter_map) if (parameter_map[p] == selectedParameter) {
			//client.publish("vila/sentjane/asgard/live_data", p , { qos: 0 });
			
			document.querySelectorAll(".room-ticker").forEach(function (t) {
				client.publish("vila/sentjane/asgard/cmd/" + t.dataset.sensor_identifier, p, { qos: 0 });
			});
		}
	}
	
	window.onload = connectMQTT;
	
    let socket;
    let chart;
    let offset = 0;
    let referenceValue = 0;
    let referenceSensorId = null;
    let selectedParameter = null;
    let maxPoints = 1000;
	let pointIndex = 0;
	let deltas = {};
	let firstData = false;

	let liveRooms = {};
	
{% for p in parameters %}
liveRooms["{{p.id}}"] = [];
	{% for r in p.live_rooms %}
		liveRooms["{{p.id}}"].push({{r}});
	{% endfor %}
{% endfor %}

	let mqtt_topics = {};
	{% for t in mqtt_topics %}
		mqtt_topics["{{t.topic}}"] = {"room_id": {{t.sensor.room.id}}, "sensor_id": {{t.sensor.id}} };
	{% endfor %}
	

    const chartColors = ['white', '#ef4444', '#22c55e', '#3b82f6', '#a855f7', '#f59e0b', '#ec4899', '#06b67f', '#f97316', '#8b5cf6'];

{% comment %}
    function connectWebSocket() {
        socket = new WebSocket('ws://' + window.location.host + '/ws/live/');
        
        socket.onmessage = function(e) {
            try {
                const response = JSON.parse(e.data);
                if (response.type === 'live_update' && response.data) {
                    if (selectedParameter && response.data.parameter_id == selectedParameter) {
                        updateLiveData(response.data);
                    }
                }
            } catch (err) {
                console.error('Parse error:', err);
            }
        };

        socket.onclose = function() {
            console.log('%cWebSocket zaprt. Ponovni poskus čez 3s...', 'color: #f59e0b');
            setTimeout(connectWebSocket, 3000);
        };

        socket.onerror = function(err) {
            console.error('WebSocket napaka:', err);

            console.log('%cWebSocket zaprt. Ponovni poskus čez 3s...', 'color: #f59e0b');
            setTimeout(connectWebSocket, 3000);
        };
    }
{% endcomment %}

    function updateLiveData(data) {
		if (data["parameter_id"] == selectedParameter) updateDeltaTable(data);
    }

    function updateDeltaTable(data) {
        const tableBody = document.getElementById('delta-table');
        const rowId = 'delta-row-' + data.room_id;
        let row = document.getElementById(rowId)
		firstData = true;;
        
        if (!row) return;

        if (referenceSensorId == data.sensor_id) {
            referenceValue = parseFloat(data.value);
        }

        const currentPressure = parseFloat(data.value);
		
		let value_td = row.querySelector('.lastValue');
		value_td.innerHTML = currentPressure;

        value_td.classList.add('!text-emerald-400');
        setTimeout(() => value_td.classList.remove('!text-emerald-400'), 300);
    }

    function updateChart() {
        if (!chart) return;
		if (!firstData) return;
        
        const tableBody = document.getElementById('delta-table');
        const rows = Array.from(tableBody.querySelectorAll('tr'));
        
        if (rows.length === 0) return;

        const time = new Date().toLocaleTimeString('sl-SI', {hour:'2-digit', minute:'2-digit'});

        while (chart.data.datasets.length < rows.length) {
            const color = chartColors[chart.data.datasets.length % chartColors.length];
            chart.data.datasets.push({
                label: 'Prostor',
                data: new Array(chart.data.labels.length).fill(null),
                borderColor: color,
                tension: 0.25,
                borderWidth: 3,
                pointRadius: 0,
                fill: false
            });
        }

        rows.forEach((row, i) => {
            const tds = row.querySelectorAll('td');
            const roomName = tds[0] ? tds[0].querySelector('span').textContent.trim() : `Prostor ${i+1}`;
            const valueStr = tds[1] ? tds[1].textContent.trim() : '';
            
            let value = null;
            if (valueStr !== '' && !isNaN(parseFloat(valueStr))) {
                value = parseFloat(valueStr);
            }

			
			if (pointIndex > 0 && chart.data.datasets[i].data[pointIndex-1] > 0) {
				let delta = (value - chart.data.datasets[i].data[pointIndex-1]);
				deltas[i] = ((deltas[i]*100) + delta) / 101;
				
				if (isNaN(deltas[i])) deltas[i] = delta;
				
				if (value > chart.data.datasets[i].data[pointIndex-1] || true) {
					let nvalue = chart.data.datasets[i].data[pointIndex-1] + (deltas[i] / 51);
					value = nvalue;
				} else {
					let nvalue = chart.data.datasets[i].data[pointIndex-1] - (deltas[i] / 51);
					if (nvalue > value) value = nvalue;
				}
			}
			//console.log(deltas);
						
            if (chart.data.datasets[i]) {
                chart.data.datasets[i].label = roomName;
				if (pointIndex >= maxPoints) {
					chart.data.datasets[i].data.push(value);
				} else {
					chart.data.datasets[i].data[pointIndex] = value;
				}
                
            }
        });

        

        if (pointIndex >= maxPoints) {
			chart.data.labels.push(time);
            chart.data.labels.shift();
            chart.data.datasets.forEach(ds => {
                if (ds.data.length > 0) ds.data.shift();
            });
        } else { pointIndex += 1; }

        chart.update('none');
    }

    // ==================== NOVO: Odstrani posamezen prostor ====================
    function removeRoom(rowId) {
        const row = document.getElementById(rowId);
        if (!row) return;

        const tableBody = document.getElementById('delta-table');
        const rows = Array.from(tableBody.querySelectorAll('tr'));
        const index = rows.indexOf(row);

        // odstranimo vrstico iz tabele
        row.remove();

        // odstranimo dataset iz grafa
        if (chart && index >= 0 && index < chart.data.datasets.length) {
            chart.data.datasets.splice(index, 1);
            chart.update();
        }
    }

    // ==================== NOVO: Počisti graf ====================
    function clearChart() {
        if (!chart) return;
        chart.data.labels = [];
        chart.data.datasets.forEach(ds => ds.data = []);
        chart.update();
    }

    // ==================== Dodaj vse / Odstrani vse ====================
    function addAllRooms() {
        const select = document.getElementById('add-room');
        const tableBody = document.getElementById('delta-table');
        
        for (let i = 1; i < select.options.length; i++) {
            const option = select.options[i];
            const rowId = option.value;
            if (document.getElementById(rowId)) continue;
			if (!liveRooms[selectedParameter.toString()].includes(parseInt(rowId.split('-')[2]))) continue;

            const row = document.createElement('tr');
            row.id = rowId;
			row.dataset.room_id = parseInt(rowId.split('-')[2]);
			row.classList.add("room-ticker");
            tableBody.appendChild(row);
			
			for (topic in mqtt_topics) if (parseInt(mqtt_topics[topic]['room_id']) == row.dataset.room_id) row.dataset.sensor_identifier = topic.split('/')[2];

            const roomName = option.innerHTML;
            row.innerHTML = `
                <td class="py-4 px-4 font-medium flex items-center">
                    <span style="cursor:pointer;" onclick="reloadChart.call(this.parentElement.parentElement)">${roomName}</span>
                    <span onclick="removeRoom('${rowId}'); event.stopImmediatePropagation();" 
                          class="ml-auto text-red-400 hover:text-red-500 text-2xl leading-none cursor-pointer">✕</span>
                </td>
                <td class="text-right py-4 px-4 lastValue"></td>
                <td class="text-right py-4 px-4 text-xs text-slate-400"></td>
            `;

            if (chart) {
                const padLength = chart.data.labels.length;
                const color = chartColors[chart.data.datasets.length % chartColors.length];
                chart.data.datasets.push({
                    label: roomName,
                    data: new Array(padLength).fill(null),
                    borderColor: color,
                    tension: 0.4,
                    borderWidth: 3,
                    pointRadius: 0,
                    fill: false,
                });
            }

            row.classList.add('!text-emerald-400');
            setTimeout(() => row.classList.remove('!text-emerald-400'), 300);
        }
		
		publishLiveDataMode();
    }

    function removeAllRooms() {
        if (!confirm('Res želiš odstraniti vse prostore iz tabele in grafa?')) return;
        document.getElementById('delta-table').innerHTML = '';
        if (chart) {
            chart.data.labels = new Array(maxPoints).fill(null);
            chart.data.datasets = [];
            chart.update();
			pointIndex = 0;
        }
    }

    document.getElementById('ref-sensor').addEventListener('change', function() {
		firstData = false;
        selectedParameter = parseInt(this.value) || null;
		publishLiveDataMode();
        referenceSensorId = null;
        referenceValue = 0;
        offset = 0;
		pointIndex = 0;
        
        document.getElementById('delta-table').innerHTML = "";
		document.getElementById('chart-name').innerHTML = this.options[this.options.selectedIndex].innerHTML;
        
        if (chart) {
            chart.data.labels = new Array(maxPoints).fill(true);
            chart.data.datasets = [];
            chart.update();
        }
		
		deltas = {};
		//addAllRooms();
    });

    document.getElementById('add-room').addEventListener('change', function() {
        if (!this.value) return;
        
        const tableBody = document.getElementById('delta-table');
        const rowId = this.value;
        
        if (document.getElementById(rowId)) {
            this.value = '';
            return;
        }

        const row = document.createElement('tr');
        row.id = rowId;
		row.classList.add("room-ticker");
        tableBody.appendChild(row);

		row.dataset.room_id = parseInt(rowId.split('-')[2]);
		for (topic in mqtt_topics) if (parseInt(mqtt_topics[topic]['room_id']) == row.dataset.room_id) row.dataset.sensor_identifier = topic.split('/')[2];

		publishLiveDataMode();
        
        const roomName = this.options[this.options.selectedIndex].innerHTML;
		row.dataset.room_name = roomName;
        
        row.innerHTML = `
            <td class="py-4 px-4 font-medium flex items-center">
                <span style="cursor:pointer;" onclick="reloadChart.call(this.parentElement.parentElement)">${roomName}</span>
                <span onclick="removeRoom('${rowId}'); event.stopImmediatePropagation();" 
                      class="ml-auto text-red-400 hover:text-red-500 text-2xl leading-none cursor-pointer">✕</span>
            </td>
            <td class="text-right py-4 px-4 lastValue"></td>
            <td class="text-right py-4 px-4 text-xs text-slate-400"></td>
        `;

        if (chart) {
            const padLength = chart.data.labels.length;
            const color = chartColors[chart.data.datasets.length % chartColors.length];
            chart.data.datasets.push({
                label: roomName,
                data: new Array(padLength).fill(null),
                borderColor: color,
                tension: 0.4,
                borderWidth: 3,
                pointRadius: 0,
                fill: false,
				cubicInterpolationMode: 'monotone'
            });
        }

        row.classList.add('!text-emerald-400');
        setTimeout(() => row.classList.remove('!text-emerald-400'), 300);
        this.value = '';
		
    });

    function reloadChart() {
        const roomName = this.querySelector('span').textContent;
        document.getElementById('chart-name').innerHTML = `Graf vrednosti – ${roomName} in ostali`;
    }

    function zeroOffset() {
        const currentDelta = parseFloat(document.querySelector('.font-bold')?.textContent) || 0;
        offset = currentDelta;
        alert(`Offset nastavljen na ${offset.toFixed(2)} Pa`);
    }

    function resetOffset() {
        offset = 0;
        alert('Offset resetiran na 0 Pa');
    }

    function exportCSV() {
        if (!chart || chart.data.datasets.length === 0) {
            alert("Ni podatkov za izvoz!");
            return;
        }
        let csv = "Čas";
        chart.data.datasets.forEach(ds => csv += ";" + ds.label);
        csv += "\n";
        
        const numPoints = chart.data.labels.length;
        for (let i = 0; i < numPoints; i++) {
            csv += chart.data.labels[i];
            chart.data.datasets.forEach(ds => {
                csv += ";" + (ds.data[i] !== undefined && ds.data[i] !== null ? ds.data[i] : '');
            });
            csv += "\n";
        }
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "diferencial_tlak.csv";
        a.click();
    }

    function initChart() {
        const ctx = document.getElementById('deltaChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: new Array(50).fill(1), datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    y: { beginAtZero: false, grid: { color: 'rgba(148,163,184,0.15)' } },
                    x: { grid: { color: 'rgba(148,163,184,0.15)' }, ticks: { maxRotation: 0 } }
                },
                plugins: { 
                    legend: { 
                        display: true, 
                        position: 'top',
                        labels: { color: '#e2e8f0', boxWidth: 12, padding: 15 }
                    } 
                }
            }
        });
    }

    window.onload = function() {
        initChart();
        //connectWebSocket();
        setInterval(updateChart, 41);
		connectMQTT();
    };

</script>

{% endblock %}
